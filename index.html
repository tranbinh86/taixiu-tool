<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>🔐 TOOL Tài Xỉu - Neon & Snow (Admin + Facebook) v2 - Fixed</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --neon-green:#00ff88;
    --neon-red:#ff0044;
    --bg-dark:#070918;
    --text:#e6ffe6;
    --muted:#cfcfcf;
  }
  html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg-dark);color:var(--text);overflow:auto;scroll-behavior:smooth;}
  body::before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,var(--neon-green),var(--neon-red),#00ff88);background-size:200% 200%;animation:animBG 28s linear infinite;filter:blur(60px);opacity:0.28;z-index:-2;}
  @keyframes animBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;box-sizing:border-box;position:relative;z-index:2;}
  .card{width:100%;max-width:960px;background:linear-gradient(180deg,rgba(0,0,0,0.45),rgba(0,0,0,0.6));border:1px solid rgba(0,255,0,0.12);box-shadow:0 8px 40px rgba(0,255,0,0.06);border-radius:14px;overflow:hidden;backdrop-filter:blur(8px);}
  .card-header{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;align-items:center;gap:12px;}
  .logo{width:64px;height:64px;border-radius:12px;background:radial-gradient(circle at 30% 30%,var(--neon-green),transparent 40%),linear-gradient(90deg,var(--neon-red),var(--neon-green));display:flex;align-items:center;justify-content:center;font-family:Orbitron,monospace;color:#001;font-weight:900;box-shadow:0 0 18px rgba(0,255,0,0.18);}
  .title{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
  .subtitle{font-size:12px;color:rgba(255,255,255,0.7)}

  .card-body{display:flex;gap:20px;padding:18px;flex-wrap:wrap;align-items:flex-start;}
  .pane{flex:1 1 320px;min-width:300px;background:rgba(0,0,0,0.55);padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.02);}
  .label{font-size:13px;margin-bottom:8px;color:rgba(255,255,255,0.85);}
  input[type="text"], select{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);box-sizing:border-box;font-size:14px;}
  input.centered { display:block; margin-left:0; transition:all 0.3s ease; }
  .md-input{width:60%;min-width:200px;transition:all 0.3s ease;}
  button.btn{display:inline-block;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;transition:all 0.2s ease;}
  button.btn:hover{transform:scale(1.05);}
  .btn-primary{background:linear-gradient(90deg,var(--neon-green),#aaffc8);color:#003;}
  .btn-accent{background:linear-gradient(90deg,var(--neon-red),#ff99aa);color:#200;}
  .muted{color:var(--muted);font-size:13px}
  .hidden{display:none !important}
  .result-box{padding:12px;border-radius:8px;background:linear-gradient(180deg,rgba(0,0,0,0.45),rgba(0,0,0,0.55));border:1px solid rgba(0,255,0,0.08);min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700}
  footer{padding:12px 18px;text-align:left;color:rgba(255,255,255,0.6);font-size:13px;border-top:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:6px;}
  #snowCanvas, #sakuraCanvas{position:fixed;left:0;top:0;pointer-events:none;z-index:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" aria-live="polite">
    <div class="card-header">
      <div class="logo">TX</div>
      <div style="flex:1">
        <div class="title">TOOL TÀI XỈU MD5</div>
        <div class="subtitle">Theme Neon — Nhập KEY để mở (Admin ẩn)</div>
      </div>
    </div>

    <div class="card-body">
      <div class="pane hidden" id="mainTool">
        <h3 style="text-align:center">🎯 Tài/Xỉu từ mã phiên / MD5</h3>

        <div class="group" style="margin-top:8px;text-align:center;">
          <div class="label">Chọn cổng game</div>
          <select id="game" style="display:inline-block;padding:10px;border-radius:8px;background:transparent;color:var(--text);border:1px solid rgba(255,255,255,0.06)">
            <option>Sunwin</option><option>B52</option><option>Rikvip</option><option>789</option><option>Hitclub</option><option>LC79</option>
          </select>
        </div>

        <div class="group" style="margin-top:14px;text-align:center;">
          <div class="label">🎲 Tài Xỉu từ mã phiên</div>
          <input id="maphien" class="md-input centered" placeholder="Nhập mã phiên..." type="text"/>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center;justify-content:center;">
            <button class="btn btn-primary" onclick="tinhTuMaPhien()">Tính</button>
            <button class="btn" onclick="clearMaphien()">Xoá</button>
          </div>
          <div style="margin-top:10px" id="result1" class="result-box">Kết quả sẽ hiện ở đây</div>
        </div>

        <hr style="margin:14px 0;border:0;border-top:1px solid rgba(255,255,255,0.04)" />

        <div class="group" style="text-align:left; transition:all 0.3s ease;">
          <div class="label">🔐 Tính từ chuỗi MD5</div>
          <input id="md5" class="md-input" placeholder="Nhập mã MD5 (32 hex)..." type="text"/>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
            <button class="btn btn-primary" onclick="tinhTuMD5(event)">Tính MD5 → Tài/Xỉu</button>
            <button class="btn" onclick="clearMD5()">Xoá</button>
          </div>
          <div style="margin-top:10px" id="result2" class="result-box">Kết quả sẽ hiện ở đây</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
<script>
function tinhTuMaPhien(){
  const maPhien = document.getElementById("maphien").value.trim();
  const result = document.getElementById("result1");
  if(!maPhien){ result.innerHTML="❌ Mã phiên không được để trống!"; result.style.color="red"; return; }
  const hash = md5(maPhien);
  const value = parseInt(hash,16)%100;
  result.innerHTML = `🔵 TÀI: ${value}%<br>🟢 XỈU: ${100-value}%`;
  result.style.color="cyan";
}
function tinhTuMD5(event){
  if(event) event.preventDefault();
  const md5Input = document.getElementById("md5").value.trim().toLowerCase();
  const result = document.getElementById("result2");
  const isValid = /^[0-9a-f]{32}$/.test(md5Input);
  if(!isValid){ result.innerHTML="❌ Mã không hợp lệ!"; result.style.color="red"; return; }
  const value = parseInt(md5Input,16)%100;
  result.innerHTML = `🔵 TÀI: ${value}%<br>🟢 XỈU: ${100-value}%`;
  result.style.color="green";
}
function clearMaphien(){ document.getElementById("maphien").value=""; document.getElementById("result1").textContent="Kết quả sẽ hiện ở đây"; }
function clearMD5(){ document.getElementById("md5").value=""; document.getElementById("result2").textContent="Kết quả sẽ hiện ở đây"; }
</script>
</body>
</html>
